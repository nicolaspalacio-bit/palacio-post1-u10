# ==============================================================================
# Configuracion de Analisis Estatico SonarQube / SonarCloud - Envios Service
# Proyecto: envios-service | Unidad 10: Metricas de Calidad y SonarQube
# ==============================================================================

# Identificacion unica del proyecto en la instancia de SonarQube o SonarCloud
sonar.projectKey=com.universidad:envios-service
sonar.projectName=Envios Service
sonar.projectVersion=1.0

# Codificacion de caracteres
sonar.sourceEncoding=UTF-8

# Rutas de codigo fuente y pruebas
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes

# Integracion de reporte de cobertura generado por JaCoCo Maven Plugin
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Politica de exclusiones: No se excluye ninguna clase (ADR-002)
# El 100% del codigo fuente corresponde a logica de negocio real
sonar.exclusions=

# Configuracion de conexion del servidor SonarQube local por defecto
sonar.host.url=http://localhost:9000
sonar.qualitygate.wait=false

# ==============================================================================
# Perfil de Calidad: "Estandar Laboratorio"
# - Lenguaje: Java (duplicado de "Sonar Way")
# - Regla activa: java:S1541 ("Methods should not be too complex")
# - Umbral configurado (Threshold): 10 de Complejidad Ciclomatica maxima por metodo
#
# Quality Gate: "Estandar Laboratorio"
# - Condicion 1: Cobertura de codigo nuevo >= 70% (Cobertura observada: 100.0%)
# - Condicion 2: Nuevos Code Smells = 0 (violaciones a S1541 u otras reglas = 0)
# - Condicion 3: Lineas duplicadas (%) < 5.0% (Duplicacion observada: 0.0%)
# ==============================================================================

